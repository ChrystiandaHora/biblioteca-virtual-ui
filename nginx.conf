# Servidor estático da interface Vue.

server {
    listen 80;
    # Sem esta linha o servidor escuta só em IPv4. Dentro do container
    # `localhost` resolve primeiro para ::1, então o healthcheck recebia
    # "connection refused" mesmo com o Nginx funcionando normalmente.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão dos textos servidos.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeçalhos de segurança básicos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Os arquivos gerados pelo Vite têm hash no nome, então podem ser guardados
    # em cache por muito tempo sem risco de servir versão velha.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html NUNCA fica em cache: é ele que aponta para os assets novos
    # depois de cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Fallback de SPA: qualquer rota desconhecida devolve o index.html para que
    # o vue-router assuma o roteamento. Sem isto, recarregar em /estante/12
    # resultaria em 404 do Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
